name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and UI contract tests
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          node tests/test_ui.cjs
          node --check ui/app.js
      - name: Windows native smoke test
        if: runner.os == 'Windows'
        env:
          MOUSE_ASSISTANT_CI_SMOKE: '1'
        run: python app.py --ci-smoke windows-source-smoke.json
      - name: Build application
        run: python scripts/build.py
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        env:
          MOUSE_ASSISTANT_CI_SMOKE: '1'
        shell: pwsh
        run: |
          $app = Resolve-Path 'dist-release/MouseActionAssistant/MouseActionAssistant.exe'
          $report = Join-Path $PWD 'windows-frozen-smoke.json'
          $process = Start-Process -FilePath $app -ArgumentList @('--ci-smoke', $report) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged smoke test timed out' }
          Get-Content $report
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          if (-not (Get-Content $report | ConvertFrom-Json).passed) { throw 'Packaged smoke report failed' }
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist-release/鼠标动作助手.app dist-release/MouseActionAssistant-macos-arm64.zip
      - name: Test Windows setup, installed app and uninstall
        if: runner.os == 'Windows'
        env:
          MOUSE_ASSISTANT_CI_SMOKE: '1'
        shell: pwsh
        run: ./scripts/test_installer.ps1
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: MouseActionAssistant-${{ matrix.artifact }}
          path: |
            dist-release/*-setup.exe
            dist-release/*.zip
            dist-release/*.dmg
          if-no-files-found: error
      - name: Upload Windows diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-diagnostics
          path: |
            windows-*-smoke.json
            windows-*-smoke.png
            windows-installer-*.log
          if-no-files-found: ignore

  prepare-release:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: MouseActionAssistant-windows-x64
          path: downloaded
      - uses: actions/download-artifact@v8
        with:
          name: MouseActionAssistant-macos-arm64
          path: downloaded
      - name: Verify and version artifacts
        run: python3 scripts/release_assets.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: prepare-release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-assets
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          resolved_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$resolved_commit" = "$GITHUB_SHA"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          release_options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "鼠标动作助手 $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md "${release_options[@]}"
