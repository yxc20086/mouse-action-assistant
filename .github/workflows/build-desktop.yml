name: Build desktop apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and UI contract tests
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          node tests/test_ui.cjs
          node --check ui/app.js
      - name: Windows native smoke test
        if: runner.os == 'Windows'
        env:
          MOUSE_ASSISTANT_CI_SMOKE: '1'
        run: python app.py --ci-smoke windows-source-smoke.json
      - name: Build application
        run: python scripts/build.py
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        env:
          MOUSE_ASSISTANT_CI_SMOKE: '1'
        shell: pwsh
        run: |
          $app = Resolve-Path 'dist-release/MouseActionAssistant/MouseActionAssistant.exe'
          $report = Join-Path $PWD 'windows-frozen-smoke.json'
          $process = Start-Process -FilePath $app -ArgumentList @('--ci-smoke', $report) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged smoke test timed out' }
          Get-Content $report
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          if (-not (Get-Content $report | ConvertFrom-Json).passed) { throw 'Packaged smoke report failed' }
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist-release/鼠标动作助手.app dist-release/MouseActionAssistant-macos-arm64.zip
      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: MouseActionAssistant-${{ matrix.artifact }}
          path: dist-release/*.zip
          if-no-files-found: error
      - name: Upload Windows diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-diagnostics
          path: |
            windows-*-smoke.json
            windows-*-smoke.png
          if-no-files-found: ignore
